<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mindful | 樂活身心冥想</title>
  
  <!-- PWA 核心設定 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4A154B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <!-- Supabase CDN (用於全球即時共修場) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #1e0826 0%, #0f051d 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --accent-purple: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
      overflow-x: hidden;
    }

    /* 頂部共修與狀態標籤 */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collective-badge {
      background: rgba(168, 85, 247, 0.18);
      border: 1px solid var(--accent-purple);
      color: #e9d5ff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* 呼吸視覺中心核心環 */
    .meditation-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 20px 0;
    }

    .breath-outer-ring {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: border-color 0.5s ease;
    }

    .breath-circle {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, #c084fc 0%, #7e22ce 70%, #581c87 100%);
      box-shadow: 0 0 35px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .breath-action {
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .breath-timer {
      font-size: 0.85rem;
      color: #e9d5ff;
      margin-top: 4px;
    }

    /* 數值資訊儀表板 */
    .dashboard {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
    }

    .metric-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .metric-card .val {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    /* 控制面板 */
    .action-panel {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-main {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #9333ea 0%, #6b21a8 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.35);
      transition: transform 0.1s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .btn-sub {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 關鍵缺口 1 修復：iOS 16+ 必須在真實點擊下觸發 TTS 的互動 Toast */
    #guidanceToast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      width: calc(100% - 32px);
      max-width: 440px;
      background: rgba(30, 10, 45, 0.95);
      border: 1px solid var(--accent-purple);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #guidanceToast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #d8b4fe;
    }

    .toast-content {
      font-size: 0.95rem;
      line-height: 1.45;
      color: #ffffff;
    }

    .toast-btn {
      background: #9333ea;
      border: none;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 頂部資訊列：創新點 3 全球共修場動態人數 -->
  <header>
    <div class="brand-title">
      <span>🧘</span> Mindful 樂活心境
    </div>
    <div class="collective-badge" id="collectiveBadge">
      <span class="pulse-dot"></span>
      <span id="collectiveCount">全球共修：同步中...</span>
    </div>
  </header>

  <!-- 冥想呼吸核心互動區 -->
  <main class="meditation-stage">
    <div class="breath-outer-ring">
      <div class="breath-circle" id="breathCircle">
        <div class="breath-action" id="breathAction">準備</div>
        <div class="breath-timer" id="breathTimer">4s</div>
      </div>
    </div>
  </main>

  <!-- 即時生理與狀態 HUD 儀表板 -->
  <section class="dashboard">
    <div class="metric-card">
      <div class="title">即時脈搏</div>
      <div class="val" id="bpmVal">72 <small style="font-size:0.65rem">BPM</small></div>
    </div>
    <div class="metric-card">
      <div class="title">心率變異度 (HRV)</div>
      <div class="val" id="hrvVal">58 <small style="font-size:0.65rem">ms</small></div>
    </div>
    <div class="metric-card">
      <div class="title">情緒感知狀態</div>
      <div class="val" id="emotionVal" style="font-size: 1rem;">平穩</div>
    </div>
  </section>

  <!-- 操作按鈕 -->
  <footer class="action-panel">
    <button class="btn-main" id="togglePracticeBtn">開始 4-7-8 調息引導</button>
    <div class="button-group">
      <button class="btn-sub" id="simulateHrvDropBtn">模擬壓力預警</button>
      <button class="btn-sub" id="speechSensingBtn">粵語情緒辨識</button>
    </div>
  </footer>

  <!-- 關鍵缺口 1 修復：解鎖 iOS 16+ User Gesture 語音互動彈窗 -->
  <div id="guidanceToast">
    <div class="toast-header">
      <span id="toastTimeTag">🌿 身心狀態感知引導</span>
      <span style="cursor:pointer" onclick="closeToast()">✕</span>
    </div>
    <div class="toast-content" id="toastMessage">偵測到目前身心節奏，建議透過調息恢復能量。</div>
    <button class="toast-btn" id="playTtsBtn">
      <span>🔊</span> 點擊聽取粵語音訊引導
    </button>
  </div>

  <script>
    /* =========================================================================
       1. PWA Service Worker 註冊 (相容相對路徑)
       ========================================================================= */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA ServiceWorker 註冊成功:', reg.scope))
          .catch(err => console.warn('PWA ServiceWorker 註冊失敗:', err));
      });
    }

    /* =========================================================================
       2. 關鍵缺口 1 修復：iOS 16+ 粵語語音引擎相容與 User Gesture 解鎖
       ========================================================================= */
    let cachedHkVoice = null;
    let pendingGuidanceText = '';

    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      // iOS / macOS 上的高品質粵語語音常帶有 Sinji, Aasing 或語言標記 zh-HK
      cachedHkVoice = voices.find(v => 
        v.lang === 'zh-HK' || 
        v.lang === 'yue-HK' || 
        v.name.includes('Sinji') || 
        v.name.includes('Aasing')
      ) || voices.find(v => v.lang.startsWith('zh'));
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    // 發音核心函數
    function speakCantoneseGuidance(text) {
      if (!('speechSynthesis' in window)) {
        alert('此裝置不支援語音合成合成');
        return;
      }
      try {
        window.speechSynthesis.cancel(); // 終止未播完的語音

        // iOS 16+ 必須在播放前確認 resume
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'zh-HK';
        utter.rate = 0.85;   // 沉穩放慢的語速適合冥想
        utter.pitch = 0.95;  // 溫和低沉
        utter.volume = 1.0;  // 保持最大音量避免 iOS 靜音

        if (cachedHkVoice) utter.voice = cachedHkVoice;
        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('TTS 執行異常:', e);
      }
    }

    // 顯示需要使用者真實點擊（User Gesture）的引導彈窗
    function showGuidanceCard(text) {
      pendingGuidanceText = text;
      document.getElementById('toastMessage').innerText = text;
      const toast = document.getElementById('guidanceToast');
      toast.classList.add('show');
    }

    function closeToast() {
      document.getElementById('guidanceToast').classList.remove('show');
    }

    // 真正滿足 WebKit User Gesture 的點擊事件
    document.getElementById('playTtsBtn').addEventListener('click', () => {
      if (pendingGuidanceText) {
        speakCantoneseGuidance(pendingGuidanceText);
      }
      closeToast();
    });

    /* =========================================================================
       3. 創新點 1：時段感知 × 狀態即時動態粵語引導生成
       ========================================================================= */
    function generateGuidanceText(emotion, hrv) {
      const hour = new Date().getHours();
      const timeSlot = hour < 6 ? '夜深' : hour < 12 ? '朝早' : hour < 18 ? '下晝' : '夜晚';

      if (emotion === 'burnout' || emotion === 'tired') {
        return `${timeSlot}喇，你嘅 HRV 只有 ${hrv}，身體處於超負荷狀態。跟我做 4-7-8 呼吸，吸氣四拍，屏息七拍，吐氣八拍，放鬆神經。`;
      } else if (emotion === 'tension' || emotion === 'anxious') {
        return `感受到你依家有啲繃緊。將注意力放返喺雙肩，慢慢放鬆，跟我嘅節奏調息。`;
      }
      return `${timeSlot}時分，你嘅身心狀態平穩，HRV 係 ${hrv}。維持呢個放鬆節奏，享受當下嘅沉靜。`;
    }

    /* =========================================================================
       4. 創新點 2：連續 HRV 趨勢預警演算 (降低 20% 即刻告警)
       ========================================================================= */
    function checkHRVTrendAndAlert(newHrv) {
      let log = JSON.parse(localStorage.getItem('mindful_hrv_history') || '[]');
      log.push({ time: Date.now(), hrv: newHrv });
      if (log.length > 10) log.shift();
      localStorage.setItem('mindful_hrv_history', JSON.stringify(log));

      if (log.length < 4) return;

      const recent2 = log.slice(-2).map(x => x.hrv);
      const avgRecent = recent2.reduce((a, b) => a + b, 0) / recent2.length;
      const earlier = log.slice(0, -2).map(x => x.hrv);
      const avgEarlier = earlier.reduce((a, b) => a + b, 0) / earlier.length;

      // 顯著下降 20%
      if (avgRecent < avgEarlier * 0.8) {
        const warning = generateGuidanceText('burnout', Math.round(avgRecent));
        showGuidanceCard(`⚠️ 【HRV 壓力預警】數值連續下降超過 20%！\n${warning}`);
      }
    }

    /* =========================================================================
       5. 創新點 3：全球共修場（Supabase Realtime 連線 + 自動降級模擬）
       ========================================================================= */
    const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    function initCollectiveRoom() {
      const counterEl = document.getElementById('collectiveCount');
      
      // 若尚未設定 Supabase 金鑰，自動啟動逼真的共修人數波動模擬
      if (SUPABASE_URL.includes('YOUR_SUPABASE') || typeof window.supabase === 'undefined') {
        let simulatedCount = 142;
        setInterval(() => {
          simulatedCount += Math.floor(Math.random() * 5) - 2;
          if (simulatedCount < 80) simulatedCount = 80;
          counterEl.innerText = `全球共修：${simulatedCount} 位修煉者`;
        }, 3500);
        return;
      }

      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const channel = client.channel('collective-breath-room');
        channel
          .on('presence', { event: 'sync' }, () => {
            const count = Object.keys(channel.presenceState()).length;
            counterEl.innerText = `全球共修：${count} 位修煉者`;
          })
          .subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
              await channel.track({ online_at: Date.now() });
            }
          });
      } catch (err) {
        console.warn('Supabase 連線退避至模擬模式', err);
      }
    }
    initCollectiveRoom();

    /* =========================================================================
       6. 呼吸引導狀態機 (4-7-8 放鬆呼吸法)
       ========================================================================= */
    let isPracticing = false;
    let breathPhase = 'idle';
    let practiceInterval = null;
    const breathCircle = document.getElementById('breathCircle');
    const breathAction = document.getElementById('breathAction');
    const breathTimer = document.getElementById('breathTimer');
    const toggleBtn = document.getElementById('togglePracticeBtn');

    function startBreathingCycle() {
      let secondsRemaining = 4;
      breathPhase = 'inhale';
      
      function runStep() {
        if (!isPracticing) return;

        if (breathPhase === 'inhale') {
          breathAction.innerText = '吸氣';
          breathCircle.style.transform = 'scale(1.45)';
          breathCircle.style.transition = 'transform 4s ease-in-out';
          secondsRemaining = 4;
        } else if (breathPhase === 'hold') {
          breathAction.innerText = '屏息';
          breathCircle.style.transform = 'scale(1.45)';
          secondsRemaining = 7;
        } else if (breathPhase === 'exhale') {
          breathAction.innerText = '呼氣';
          breathCircle.style.transform = 'scale(1.0)';
          breathCircle.style.transition = 'transform 8s ease-in-out';
          secondsRemaining = 8;
        }

        breathTimer.innerText = `${secondsRemaining}s`;

        const countdown = setInterval(() => {
          if (!isPracticing) {
            clearInterval(countdown);
            return;
          }
          secondsRemaining--;
          if (secondsRemaining > 0) {
            breathTimer.innerText = `${secondsRemaining}s`;
          } else {
            clearInterval(countdown);
            // 狀態推進
            if (breathPhase === 'inhale') breathPhase = 'hold';
            else if (breathPhase === 'hold') breathPhase = 'exhale';
            else if (breathPhase === 'exhale') breathPhase = 'inhale';
            runStep();
          }
        }, 1000);
      }

      runStep();
    }

    toggleBtn.addEventListener('click', () => {
      isPracticing = !isPracticing;
      if (isPracticing) {
        toggleBtn.innerText = '結束本次調息';
        toggleBtn.style.background = '#4b5563';
        startBreathingCycle();
      } else {
        toggleBtn.innerText = '開始 4-7-8 調息引導';
        toggleBtn.style.background = '';
        breathAction.innerText = '準備';
        breathTimer.innerText = '4s';
        breathCircle.style.transform = 'scale(1.0)';
        
        // 缺口 3 修復方案：練習完成後即時通知（不依賴脆弱的背景計時器）
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('Mindful 調息完成', {
            body: '恭喜完成調息！身心放鬆指標已同步儲存。',
            icon: './icon-192.png'
          });
        }
      }
    });

    /* =========================================================================
       7. 模擬按鈕與觸發展示
       ========================================================================= */
    document.getElementById('simulateHrvDropBtn').addEventListener('click', () => {
      // 模擬 HRV 急遽下降情境
      document.getElementById('bpmVal').innerHTML = `88 <small style="font-size:0.65rem">BPM</small>`;
      document.getElementById('hrvVal').innerHTML = `32 <small style="font-size:0.65rem">ms</small>`;
      document.getElementById('emotionVal').innerText = '過勞 / 緊繃';
      
      checkHRVTrendAndAlert(32);
    });

    document.getElementById('speechSensingBtn').addEventListener('click', () => {
      // 模擬語音辨識出緊繃情緒
      const dynamicPrompt = generateGuidanceText('tension', 45);
      showGuidanceCard(dynamicPrompt);
    });
  </script>
</body>
</html>
